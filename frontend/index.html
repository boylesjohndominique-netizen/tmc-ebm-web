<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trinidad Municipal College Equipment Borrowing &amp; Tracking Management System. Efficient equipment reservation, live inventory tracking, and verified handover operations." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1b365d" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TMC Equipment Borrowing &amp; Tracking System" />
    <meta property="og:description" content="Equipment request, inventory tracking, and handover system for Trinidad Municipal College." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TMC Equipment Borrowing &amp; Tracking System" />
    <meta name="twitter:description" content="Equipment request, inventory tracking, and handover system for Trinidad Municipal College." />
    <meta name="twitter:image" content="/logo.png" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <title>TMC Equipment Borrowing &amp; Tracking</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TMC Equipment Borrowing & Tracking System",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "description": "Equipment borrowing, inventory management, and tracking system for Trinidad Municipal College."
      }
    </script>

    <script>
      // Apply the saved theme before first paint to avoid a light-mode flash.
      (function () {
        try {
          var t = localStorage.getItem('tmc-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
